services:
  db:
    image: postgres:16
    container_name: owla-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: owla
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: owla
    volumes:
      - owla-pgdata-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owla -d owla"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: owla-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://owla:${POSTGRES_PASSWORD:?}@db:5432/owla
      AUTH_SECRET: ${AUTH_SECRET:?defina AUTH_SECRET via openssl rand -base64 32}
    ports:
      - "3000:3000"

volumes:
  owla-pgdata-prod: